name: Backend Validation

on:
  push:
    paths:
      - "backend/**"
      - "scripts/dev/**"
      - "tests/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/dev/**"
      - "tests/**"
      - ".github/workflows/backend.yml"

jobs:
  backend-tests:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GRANDPA_ASSISTANT_CI: "1"
      LLM_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      OLLAMA_REQUEST_TIMEOUT_SECONDS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile backend Python files
        shell: pwsh
        run: |
          Get-ChildItem backend -Recurse -Filter *.py | ForEach-Object {
            python -m py_compile $_.FullName
          }

      - name: Startup smoke check
        run: python scripts/dev/startup_smoke_check.py
